name: Tile Submission (manual)
description: Manually submit your IP tile — most tiles are submitted automatically by the precheck workflow instead.
title: "Tile Submission: "
labels: ["submission", "manual"]
body:
  - type: markdown
    attributes:
      value: |
        ## SemiCoLab IP Tile Submission — manual fallback

        Most tiles don't need this form: if your repo uses the standard
        [semicolab-precheck](https://github.com/MifralTech/semicolab-precheck)
        workflow, a passing verification run opens this submission for you
        automatically.

        Use this form only if the automated submission didn't happen for
        some reason. Copy the values below from your tile repo's
        `results.json` (the output of a real, passing VeriFlow run) —
        not from memory.

  - type: input
    id: tile_name
    attributes:
      label: Tile Name
      placeholder: "32-bit Accumulator"
    validations:
      required: true

  - type: input
    id: tile_author
    attributes:
      label: Author
      placeholder: "Your full name"
    validations:
      required: true

  - type: input
    id: top_module
    attributes:
      label: Top Module
      description: From results.json's "top_module" field.
      placeholder: "acc_tile"
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version
      placeholder: "1.0.0"
    validations:
      required: true

  - type: input
    id: repo_url
    attributes:
      label: Repository URL
      placeholder: "https://github.com/username/ip-my-tile"
    validations:
      required: true

  - type: input
    id: commit
    attributes:
      label: Commit SHA
      description: The commit whose results.json shows status "PASS" (first 7 characters is enough).
      placeholder: "a3f92c1"
    validations:
      required: true

  - type: input
    id: results_json_url
    attributes:
      label: Link to results.json
      description: Direct link to the passing results.json in your repo, at the commit above.
      placeholder: "https://github.com/username/ip-my-tile/blob/a3f92c1/results.json"
    validations:
      required: true

  - type: checkboxes
    id: precheck_confirmed
    attributes:
      label: Precheck confirmation
      options:
        - label: My results.json shows "status": "PASS"
          required: true
        - label: The information above matches my results.json
          required: true
